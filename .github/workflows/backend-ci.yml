name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spendwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Required to import the FastAPI app in CI; no ENVIRONMENT override here,
    # so unit tests exercise the normal development default.
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/spendwise_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the existing unit suite with the application's normal defaults.
      - name: Run backend unit tests
        run: python -m pytest -v --ignore=tests/api_integration_test.py

      # Start a fresh pytest process with test-only settings and the disposable DB.
      - name: Run PostgreSQL API integration tests
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/spendwise_test
        run: python -m pytest -v tests/api_integration_test.py
